# @package _global_
adapt:
  # lora trains low-rank deltas; qbyt_full trains all QbyT weights.
  # encoder_qbyt_full additionally trains the entire encoder (no LoRA).
  method: lora
  keyword: hey eva
  slug: ""
  phase: tts
  # Ordered phases used by the one-command trainer and sweep.  Keeping the
  # historical default preserves TTS -> real continual adaptation, while a
  # real-only dataset can set [real] explicitly instead of failing on a
  # missing tts_train.csv.
  train_phases: [tts, real]
  # [joint] adapts once on real + TTS + LibriPhrase + background data.
  # Joint cannot be combined with the sequential tts/real phases.
  joint:
    real_fraction: 0.6
    background_keyword_fraction: 0.5
    background_eval_list: ""
    background_val_samples: 512
    background_eval_seed: 2026
  stage: all
  data_root: ""
  exp_root: ""
  sources:
    tts:
      positive_dir: ""
      negative_root: ""
    real:
      positive_dir: ""
      negative_root: ""
  rank: 16
  alpha: 32
  lr: null            # alias for learning_rate; only applied when explicitly set
  learning_rate: 4.0e-4
  # Only used by encoder_qbyt_full; independent of learning_rate and its lr alias.
  encoder_learning_rate: 3.0e-6
  encoder_schedule:
    # Icefall fine-tuning schedule starts after the initial training ramp.
    start_batch_count: 100000.0
    # Global audio seconds across all ranks per schedule-count increment.
    reference_duration: 600.0
  optimizer: adam
  weight_decay: 0.0
  warmup_steps: 100
  max_steps: 3000
  mix_ratio: 0.5
  sample_lens: 3000
  batch_size_per_gpu: 64
  val_batch_size: 64
  num_workers: 2
  # null = min(num_workers, 4). The target-keyword val set is small, so it does not
  # need the train worker count; every extra worker costs file descriptors.
  val_num_workers: null
  eval_fraction: 0.2
  eval_seed: 2025
  init_checkpoint: ""
  params_file: ""
  # Explicit model-selection objective for Lightning's crash-safety checkpoints.
  # Alternatives: val_lph_auc, or a future logged composite score.
  checkpoint_monitor: val_target_auc
  checkpoint_filename: step_{step:06d}_target_auc_{val_target_auc:.6f}
  lora_targets:
    - audio_key.weight
    - text_query.weight
  validation:
    # Counted in training-batch iterations per rank. With gradient accumulation
    # k, this is approximately val_check_interval/k optimizer steps. The counter
    # continues across virtual epoch boundaries.
    val_check_interval: 1000
    # null = full validation set; an int caps batches per val dataloader, which
    # matters because the LibriPhrase eval split has ~270k pairs.
    limit_val_batches: null
  console:
    rich: true
    device_stats: false
    throughput: false
    refresh_rate: null
    leave: true
  logging:
    backends: [csv, tensorboard]
    wandb:
      project: dma-kws
      mode: online
    trackio:
      project: dma-kws
  sweep:
    enabled: false
    # Target number of successfully completed trials in durable study storage;
    # reruns only fill the remaining quota.
    n_trials: 20
    lambda_forget: 1.0
    lph_subset: 2000
    search_mix: false
    single_phase: false
    # Final target-eval artifacts are written below the last phase's versioned
    # training log directory as target_eval/{summary.json,predictions.jsonl,*.png}.
    plot_curves: true
    plot_dpi: 160
    # Optional ROC/DET guide: rates use [0, 1]; configure at most one bound.
    plot_min_recall: null
    plot_max_fpr: null
    storage: ""
    study_name: ""

  # Offline MUSAN mixing for TRAIN positives. This is the offline counterpart of
  # stage2.noise_augmentation, which adapt rejects because manifests carry
  # precomputed fbank instead of waveforms. Only fbank features are materialized;
  # the trainer, dataset and joint validation stay untouched.
  # See docs/superpowers/plans/2026-10-13-adapt-offline-musan-mix.md.
  noise_augmentation:
    enabled: false
    generation: g1            # recipe/feature namespace; bump when the config changes
    seed: 2025
    musan_split_dir: ""       # holds train_background.list, eval_musan.list, split.json
    train_list: ""            # default: <musan_split_dir>/train_background.list
    eval_list: ""             # default: <musan_split_dir>/eval_musan.list
    variants_per_sample: 1    # copies per enabled category per train positive
    keep_original: true
    dry_run: false            # plan + report only, materialize nothing
    phases: []                # [] = every prepared phase; joint runs should use [real]
    categories:
      noise:  {enabled: false, snr_db_min: 0.0,        snr_db_max: 15.0}
      music:  {enabled: false, snr_db_min: 5.0,        snr_db_max: 20.0}
      speech: {enabled: false, relative_db_min: -15.0, relative_db_max: -5.0}
